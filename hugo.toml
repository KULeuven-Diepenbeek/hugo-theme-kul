[module]
  [module.hugoVersion]
    min = '0.140.2'

[mediaTypes]
  [mediaTypes.'text/javascript']
    suffixes = ['js']

[outputFormats]
  [outputFormats.print]
    name= 'print'
    baseName = 'index.print'
    isHTML = true
    mediaType = 'text/html'
    permalinkable = false
    noUgly = true

  [outputFormats.source]
    name= 'source'
    baseName = 'index.source'
    isHTML = false
    mediaType = 'text/markdown'
    permalinkable = false
    noUgly = true

  # unused since 7.0.0 but left in here to generate warnings
  [outputFormats.search]
    name= 'search'
    baseName = 'index.searchindex'
    isHTML = true
    mediaType = 'text/html'
    permalinkable = false
    noUgly = true

  # unused since 7.0.0 but left in here to generate warnings
  [outputFormats.searchpage]
    name= 'searchpage'
    baseName = 'index.searchpage'
    isHTML = true
    mediaType = 'text/html'
    permalinkable = false
    noUgly = true

[params]
  themeVariant = 'kul'
  mermaidInitialize = "{ \"theme\": \"base\", \"themeVariables\": { \"primaryBorderColor\": \"#1d8db0\",  \"primaryTextColor\": \"#0c495c\", \"primaryColor\": \"#dce7f0\" } }"
  mermaidZoom = true

[params.relearn.dependencies]
  [params.relearn.dependencies.math]
    name = 'Math'
  [params.relearn.dependencies.mermaid]
    name = 'Mermaid'
  [params.relearn.dependencies.openapi]
    name = 'OpenApi'

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)'], ['$', '$']]
